[tools]
go = "1.27.4"
bun = "1.4.4"

[tasks.default]
description = "Run tests in short mode"
depends = ["test"]

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.dev]
description = "Run the app in development mode with hot reload (mygo dev)"
raw = true
run = "bun run dev"

[tasks.build]
description = "Build SBGen.app and a DMG into build/ (mygo build); pass e.g. -- -platform darwin/universal"
depends = ["clean"]
run = "bun run build"

[tasks.test]
description = "Run tests in short mode (skips generating a full project)"
depends = ["fmt"]
run = [
  "echo 'Run tests in short mode...'",
  "go test -v -p 1 -short ./...",
]

[tasks.all_tests]
description = "Run all tests including slow integration tests"
run = [
  "echo 'Run all tests...'",
  "go test -v -p 1 ./...",
]

[tasks.clean]
description = "Remove build output (build/ and dist/)"
run = [
  "echo 'Cleaning...'",
  "rm -rf build dist",
]
