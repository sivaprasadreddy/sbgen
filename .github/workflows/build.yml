name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
#          - os: ubuntu-latest
#            goos: linux
#          - os: windows-latest
#            goos: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Build
        run: wails3 package

      - uses: actions/upload-artifact@v7
        with:
          name: sbgen-${{ matrix.goos }}
          path: bin/sbgen.app
