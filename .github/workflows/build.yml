name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            platform: darwin/universal
#          - os: ubuntu-latest
#            goos: linux
#            platform: linux/amd64,linux/arm64
#          - os: ubuntu-latest
#            goos: windows
#            platform: windows/amd64,windows/arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -short skips the test that generates a full project, which needs a JDK.
      - name: Test
        run: go test -short ./...

      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v7
        with:
          name: sbgen-${{ matrix.goos }}
          path: build/
