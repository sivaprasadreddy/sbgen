name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS desktop
    runs-on: macos-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match vx.x.x (for example v1.2.3)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package macOS app
        run: |
          export SBGEN_VERSION="${GITHUB_REF_NAME#v}"
          bun run build -- -platform darwin/universal -skip-dmg

      - name: Archive app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/darwin-universal/SBGen.app \
            "sbgen-${GITHUB_REF_NAME}-macos.zip"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SBGEN ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "sbgen-${GITHUB_REF_NAME}-macos.zip"
